<style>
:root{
  --navy:#1B3A6B;
  --navy2:#122747;
  --navy3:#0D1E3D;
  --gold:#C8962E;
  --gold2:#E8B84B;
  --red:#C0392B;
  --bg:#EEF1F7;
  --white:#fff;
  --border:#D1D9E6;
  --text:#1a2540;
  --muted:#6B7A99;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;}
body{background:var(--bg);min-height:100vh;}

/* ── HEADER ── */
#header{background:var(--navy3);border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.35);}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:68px;gap:16px;}

/* Logo area */
.logo-area{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.logo-mark{width:46px;height:46px;background:var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:var(--navy3);letter-spacing:-1px;flex-shrink:0;box-shadow:0 2px 10px rgba(200,150,46,.4);}
.logo-text{display:flex;flex-direction:column;}
.logo-name{font-size:17px;font-weight:800;color:#fff;letter-spacing:.3px;line-height:1.1;}
.logo-name span{color:var(--gold);}
.logo-sub{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:1.5px;font-weight:600;margin-top:2px;}

/* Page title */
.page-title-wrap{flex:1;text-align:center;}
.page-title{font-size:14px;font-weight:700;color:rgba(255,255,255,.9);letter-spacing:.3px;}
.page-code{font-size:10px;color:var(--gold);letter-spacing:2px;font-weight:600;margin-top:2px;}

/* Sync + actions */
.header-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.sync-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:5px 12px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#9CA3AF;flex-shrink:0;}
.sync-dot.live{background:#4ADE80;box-shadow:0 0 6px #4ADE80;animation:pulse 2s infinite;}
.sync-dot.saving{background:#FBBF24;animation:pulse .5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
#sync-txt{color:rgba(255,255,255,.6);font-size:11px;font-weight:500;white-space:nowrap;}
.hdr-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.hdr-btn:hover{background:rgba(255,255,255,.2);}
.hdr-btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy3);}
.hdr-btn.gold:hover{background:var(--gold2);}
.hdr-btn.danger{background:rgba(192,57,43,.3);border-color:rgba(192,57,43,.5);}

/* ── SUBHEADER ── */
#subheader{background:var(--navy2);padding:8px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.07);}
.company-info{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.ci-item{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.5);}
.ci-item span{color:rgba(255,255,255,.8);font-weight:500;}
.stats-row{display:flex;gap:10px;}
.stat-chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:4px 12px;text-align:center;}
.stat-chip-val{font-size:15px;font-weight:800;color:var(--gold);}
.stat-chip-lbl{font-size:9px;color:rgba(255,255,255,.45);font-weight:600;letter-spacing:.5px;}

/* ── CANVAS ── */
#canvas-wrap{overflow:auto;width:100%;padding:36px 48px 100px;min-height:calc(100vh - 110px);}
#canvas{display:flex;flex-direction:column;align-items:center;min-width:max-content;}

/* ── PRESIDENT NODE ── */
.pres-node{background:linear-gradient(135deg,#4C1D95,#6D28D9);border-radius:16px;padding:14px 28px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 6px 24px rgba(109,40,217,.4);border:2px solid rgba(255,255,255,.15);transition:all .2s;}
.pres-node:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(109,40,217,.55);}
.pres-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#C4B5FD,#A78BFA);color:#4C1D95;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0;}
.pres-role{font-size:10px;font-weight:700;color:#C4B5FD;letter-spacing:1.5px;}
.pres-name{font-size:14px;font-weight:700;color:#fff;margin-top:2px;}
.add-pres-btn{background:#fff;border:2px dashed #A78BFA;border-radius:12px;padding:10px 24px;font-size:13px;font-weight:600;color:#6D28D9;cursor:pointer;transition:all .2s;margin-bottom:6px;}
.add-pres-btn:hover{background:#F5F3FF;border-color:#6D28D9;}

/* ── GM NODE ── */
.gm-node{background:linear-gradient(135deg,var(--navy2),var(--navy));border-radius:16px;padding:14px 28px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 6px 24px rgba(27,58,107,.5);border:2px solid rgba(255,255,255,.12);transition:all .2s;}
.gm-node:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(27,58,107,.65);}
.gm-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy3);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0;}
.gm-role{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:1.5px;}
.gm-name{font-size:14px;font-weight:700;color:#fff;margin-top:2px;}

/* ── CONNECTORS ── */
.v-line{width:2px;background:linear-gradient(180deg,var(--gold)60,#CBD5E1);margin:0 auto;}
.h-bar{position:absolute;top:0;height:2px;background:var(--border);}
.chain-circle{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--navy3);font-weight:800;box-shadow:0 2px 8px rgba(200,150,46,.4);}

/* ── DEPT CARD ── */
.dept-card{border-radius:14px;overflow:hidden;display:flex;align-items:stretch;box-shadow:0 3px 14px rgba(0,0,0,.1);border:1.5px solid var(--border);width:190px;transition:all .22s;background:#fff;position:relative;}
.dept-card:hover{transform:translateY(-3px);}
.dept-accent{width:5px;flex-shrink:0;}
.dept-inner{flex:1;padding:11px 13px;cursor:pointer;}
.dept-num-badge{width:34px;height:34px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-bottom:7px;box-shadow:0 2px 6px rgba(0,0,0,.2);}
.dept-label{font-size:13px;font-weight:800;color:var(--text);line-height:1.3;}
.dept-meta{font-size:10px;color:var(--muted);margin-top:3px;font-weight:500;}
.dept-btns{display:flex;flex-direction:column;border-left:1px solid var(--border);}
.dept-btn{flex:1;background:#FAFBFD;border:none;cursor:pointer;font-size:14px;padding:0 10px;color:var(--muted);transition:all .15s;}
.dept-btn:hover{color:var(--navy);background:#EEF1F7;}
.dept-btn:first-child{border-bottom:1px solid var(--border);}
.move-row{display:flex;justify-content:space-between;margin-top:5px;gap:4px;}
.move-btn{flex:1;background:#fff;border:1px solid var(--border);border-radius:6px;padding:3px 0;font-size:11px;cursor:pointer;color:var(--muted);transition:all .15s;font-weight:600;}
.move-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy);}

/* ── INSERT ── */
.insert-spacer{display:flex;flex-direction:column;align-items:center;padding-top:0;opacity:0;transition:opacity .2s;}
.dept-row-outer:hover .insert-spacer{opacity:1;}
.insert-col-btn{background:#fff;border:1.5px dashed var(--border);border-radius:20px;padding:8px 4px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;writing-mode:vertical-rl;height:60px;transition:all .15s;}
.insert-col-btn:hover{border-color:var(--gold);color:var(--gold);background:#FFFBF0;}

/* ── ROLE BOX ── */
.role-box{border-radius:10px;border:1.5px solid var(--border);background:#fff;padding:8px 11px;text-align:center;cursor:pointer;transition:all .15s;width:136px;box-shadow:0 1px 5px rgba(0,0,0,.06);}
.role-box:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(0,0,0,.1);}
.role-box-icon{font-size:14px;margin-bottom:2px;}
.role-box-title{font-size:11px;font-weight:700;color:var(--text);line-height:1.3;}
.role-box-name{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.3;font-weight:500;}
.role-node{display:flex;flex-direction:column;align-items:center;}
.role-level{display:flex;align-items:flex-start;justify-content:center;position:relative;}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;right:28px;z-index:9999;background:var(--navy3);color:#fff;border-radius:12px;padding:12px 22px;font-size:13px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.3);opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;border-left:3px solid var(--gold);}
.toast.show{opacity:1;transform:translateY(0);}

/* ── OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(10,18,35,.6);display:flex;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(6px);}
.modal{background:#fff;border-radius:20px;width:500px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 28px 72px rgba(0,0,0,.28);}
.modal-hdr{background:linear-gradient(135deg,var(--navy3),var(--navy));border-radius:20px 20px 0 0;padding:20px 26px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gold);}
.modal-hdr-title{color:#fff;font-weight:700;font-size:16px;}
.modal-close{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;}
.modal-body{padding:26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.8px;}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--text);font-family:inherit;outline:none;box-sizing:border-box;transition:border .2s;background:#FAFBFD;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--navy);background:#fff;}
.field textarea{resize:vertical;min-height:68px;}
.type-pills{display:flex;gap:7px;flex-wrap:wrap;}
.type-pill{padding:6px 13px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:600;border:1.5px solid var(--border);background:#F9FAFB;color:var(--muted);transition:all .15s;}
.quick-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.quick-btn{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:#F9FAFB;color:var(--text);cursor:pointer;transition:all .15s;}
.quick-btn:hover{border-color:var(--gold);color:var(--gold);background:#FFFBF0;}
.color-row{display:flex;gap:8px;flex-wrap:wrap;}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;transition:transform .15s;}
.btn-row{display:flex;gap:10px;margin-top:20px;}
.btn-primary{flex:1;background:linear-gradient(135deg,var(--navy),#2952A0);color:#fff;border:none;border-radius:10px;padding:12px 0;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;}
.btn-primary:hover{opacity:.88;}
.btn-secondary{flex:1;background:#F3F4F6;color:var(--text);border:none;border-radius:10px;padding:12px 0;font-size:14px;cursor:pointer;}
.btn-danger-sm{background:#FEF2F2;border:1px solid #FCA5A5;color:#DC2626;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}

/* ── PANEL ── */
.panel{background:#fff;border-radius:20px;width:580px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 28px 72px rgba(0,0,0,.28);}
.panel-hdr{border-radius:20px 20px 0 0;padding:22px 26px;}
.panel-body{padding:22px 26px;}
.role-list-item{display:flex;align-items:center;justify-content:space-between;background:#FAFBFD;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:7px;transition:all .15s;}
.role-item-badge{display:inline-block;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:600;margin-top:3px;}

/* ── LEGEND ── */
#legend{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy3);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:8px 18px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.25);}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.6);font-weight:500;}
.leg-dot{width:10px;height:10px;border-radius:3px;border:1.5px solid;}

/* ── WATERMARK ── */
.watermark{position:fixed;bottom:16px;right:24px;font-size:10px;color:rgba(0,0,0,.2);font-weight:600;letter-spacing:.5px;z-index:49;}
</style>

/* ── Firebase ── */
function initFirebase(){
  if(FIREBASE_CONFIG.apiKey.includes("PASTE_YOUR")){
    setSyncStatus("","Local only — Firebase not configured");
    try{const d=localStorage.getItem("effica_obs_v3");if(d)data=JSON.parse(d);}catch(e){}
    render();return;
  }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database();firebaseOk=true;
    setSyncStatus("connecting","Connecting…");
    db.ref(DB_PATH).on("value",snap=>{
      const v=snap.val();
      if(v)data=v;else db.ref(DB_PATH).set(data);
      render();setSyncStatus("live","Live — synced to all users");
    },()=>setSyncStatus("error","Firebase error"));
    db.ref(".info/connected").on("value",snap=>{
      setSyncStatus(snap.val()?"live":"connecting",snap.val()?"Live — synced to all users":"Reconnecting…");
    });
  }catch(e){setSyncStatus("","Error");render();}
}
function setSyncStatus(s,m){
  const d=document.getElementById("sync-dot");
  d.className="sync-dot"+(s?" "+s:"");
  document.getElementById("sync-txt").textContent=m;
}
function saveData(){
  if(firebaseOk&&db){
    setSyncStatus("saving","Saving…");
    db.ref(DB_PATH).set(data).then(()=>{setSyncStatus("live","Live — synced");showToast("✅ Saved & synced");}).catch(()=>{});
  }else{
    try{localStorage.setItem("effica_obs_v3",JSON.stringify(data));}catch(e){}
    showToast("✅ Saved locally");
  }
}
function showToast(m){
  const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2500);
}

/* ── ROLE TREE ── */
function buildRoleTree(dept){
  const roles=dept.roles;
  if(!roles.length)return`<div style="font-size:11px;color:#9CA3AF;padding:8px;font-style:italic;">No roles — click ➕ to add</div>`;
  const byGroup={};
  roles.forEach(r=>{const g=r.group||"Team";if(!byGroup[g])byGroup[g]=[];byGroup[g].push(r);});
  const groupRank=g=>Math.min(...byGroup[g].map(r=>TYPE_CFG[r.type]?.order??9));
  const sortedGroups=Object.keys(byGroup).sort((a,b)=>groupRank(a)-groupRank(b));
  const soloGroups=sortedGroups.filter(g=>byGroup[g].every(r=>r.type==="tl"||r.type==="mgr")||byGroup[g].length===1);
  const leafGroups=sortedGroups.filter(g=>!soloGroups.includes(g));
  let html="";
  soloGroups.forEach(g=>byGroup[g].forEach(r=>{html+=`<div class="v-line" style="height:12px;"></div>${roleNodeHTML(r,dept.id)}`;}));
  if(leafGroups.length>0){
    html+=`<div class="v-line" style="height:12px;"></div>`;
    html+=`<div class="role-level" style="position:relative;gap:0;align-items:flex-start;">`;
    if(leafGroups.length>1)html+=`<div class="h-bar" style="left:25%;right:25%;"></div>`;
    leafGroups.forEach(g=>{
      const sortedR=[...byGroup[g]].sort((a,b)=>(TYPE_CFG[a.type]?.order??9)-(TYPE_CFG[b.type]?.order??9));
      const typeRows=[];let cur=null;
      sortedR.forEach(r=>{if(!cur||cur.type!==r.type){cur={type:r.type,items:[r]};typeRows.push(cur);}else cur.items.push(r);});
      html+=`<div class="role-node" style="margin:0 4px;">`;
      html+=`<div class="v-line" style="height:12px;"></div>`;
      if(leafGroups.length>1)html+=`<div style="font-size:9px;font-weight:700;color:#9CA3AF;letter-spacing:.5px;margin-bottom:4px;background:#F1F5F9;border-radius:20px;padding:1px 8px;">${g}</div>`;
      typeRows.forEach(row=>{
        html+=`<div style="position:relative;display:flex;gap:4px;justify-content:center;align-items:flex-start;">`;
        if(row.items.length>1)html+=`<div class="h-bar" style="left:22%;right:22%;"></div>`;
        row.items.forEach(r=>{
          html+=`<div style="display:flex;flex-direction:column;align-items:center;">`;
          if(row.items.length>1)html+=`<div class="v-line" style="height:10px;"></div>`;
          html+=roleNodeHTML(r,dept.id);
          html+=`</div>`;
        });
        html+=`</div><div class="v-line" style="height:6px;"></div>`;
      });
      html+=`</div>`;
    });
    html+=`</div>`;
  }
  return html;
}

function roleNodeHTML(r,deptId){
  const s=TYPE_CFG[r.type]||TYPE_CFG.tr;
  return `<div class="role-box" onclick="openEditRole('${deptId}','${r.id}')"
    onmouseover="this.style.background='${s.bg}';this.style.borderColor='${s.border}';"
    onmouseout="this.style.background='#fff';this.style.borderColor='var(--border)';">
    <div class="role-box-icon">${s.icon}</div>
    <div class="role-box-title">${r.role}</div>
    ${r.name?`<div class="role-box-name">${r.name}</div>`:""}
  </div>`;
}

    <div class="gm-name">${data.gm.name}</div></div>

  </div>
  </div>`;

  // Connector to dept row
  html+=`<div class="v-line" style="height:28px;"></div>`;
  html+=`<div style="position:relative;width:100%;height:2px;background:linear-gradient(90deg,transparent,#CBD5E1 20%,#CBD5E1 80%,transparent);margin-bottom:0;"></div>`;

  // Dept columns
  html+=`<div class="dept-row-outer" style="display:flex;align-items:flex-start;justify-content:center;gap:0;position:relative;padding-top:0;">`;

  data.departments.forEach((dept,di)=>{
    const isFirst=di===0,isLast=di===data.departments.length-1;
    html+=`
    <div class="insert-spacer" style="padding-top:0;">
      <div class="v-line" style="height:16px;opacity:0;"></div>
      <button class="insert-col-btn" onclick="openAddDeptModal(${di})" title="Insert department here">➕</button>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;padding:0 3px;">
      <div class="v-line" style="height:16px;"></div>
      <div>
        <div class="dept-card"
          onmouseover="this.style.boxShadow='0 8px 24px ${dept.color}45';this.style.borderColor='${dept.color}';this.style.transform='translateY(-3px)';"
          onmouseout="this.style.boxShadow='0 3px 14px rgba(0,0,0,.1)';this.style.borderColor='var(--border)';this.style.transform='none';">
          <div class="dept-accent" style="background:linear-gradient(180deg,${dept.color},${dept.color}60);"></div>
          <div class="dept-inner" onclick="openDeptPanel('${dept.id}')">
            <div class="dept-num-badge" style="background:linear-gradient(135deg,${dept.color},${dept.color}90);">${dept.num}</div>
            <div class="dept-label">${dept.label}</div>
            <div class="dept-meta">${dept.headcount} people · ${dept.roles.length} roles</div>
          </div>
          <div class="dept-btns">
            <button class="dept-btn" onclick="openAddRole('${dept.id}')" title="Add employee">➕</button>
            <button class="dept-btn" onclick="openEditDept('${dept.id}')" title="Edit">✏️</button>
          </div>
        </div>
        <div class="move-row">
          ${!isFirst?`<button class="move-btn" onclick="moveDept('${dept.id}',-1)" title="Move left">◀</button>`:`<div style="flex:1;"></div>`}
          ${!isLast?`<button class="move-btn" onclick="moveDept('${dept.id}',1)" title="Move right">▶</button>`:`<div style="flex:1;"></div>`}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;">${buildRoleTree(dept)}</div>
    </div>`;
  });

  // Insert after last
  html+=`<div class="insert-spacer">
    <div class="v-line" style="height:16px;opacity:0;"></div>
    <button class="insert-col-btn" onclick="openAddDeptModal(${data.departments.length})" title="Add department at end">➕</button>
  </div></div>`;

  canvas.innerHTML=html;

  // Legend
  document.getElementById("legend").innerHTML=Object.entries(TYPE_CFG).map(([k,s])=>
    `<div class="leg-item"><div class="leg-dot" style="background:${s.bg};border-color:${s.border};"></div>${s.icon} ${s.label}</div>`).join("");
}

function saveDept(id){

  d.headcount=+document.getElementById("ed_h").value||d.headcount;

function deleteDept(id){
  if(!confirm("Delete this department and all its positions?"))return;
  data.departments=data.departments.filter(d=>d.id!==id);
  renumberDepts();saveData();render();closeOverlay();
}
function moveDept(id,dir){
  const i=data.departments.findIndex(d=>d.id===id);
  const ni=i+dir;
  if(ni<0||ni>=data.departments.length)return;
  [data.departments[i],data.departments[ni]]=[data.departments[ni],data.departments[i]];
  renumberDepts();saveData();render();
}
function renumberDepts(){data.departments.forEach((d,i)=>d.num=String(i+1).padStart(2,"0"));}

function saveRole(deptId,roleId){
  const d=data.departments.find(x=>x.id===deptId);
  const r=d.roles.find(x=>x.id===roleId);
  r.role=document.getElementById("er_r").value.trim()||r.role;
  r.name=document.getElementById("er_n").value.trim();
  r.group=document.getElementById("er_g").value.trim()||r.group;
  r.type=document.getElementById("er_t").value||r.type;
  saveData();render();closeOverlay();
}
function deleteRole(deptId,roleId){
  if(!confirm("Delete this position?"))return;
  const d=data.departments.find(x=>x.id===deptId);
  d.roles=d.roles.filter(r=>r.id!==roleId);
  d.headcount=Math.max(0,d.headcount-1);
  saveData();render();closeOverlay();
}

/* ── ADD ROLE ── */
function openAddRole(deptId){
  const d=data.departments.find(x=>x.id===deptId);
  const groups=[...new Set(d.roles.map(r=>r.group).filter(Boolean))];
  const typePills=Object.entries(TYPE_CFG).map(([t,s])=>`<div class="type-pill" id="atp_${t}" onclick="selAType('${t}')" style="${t==='jr'?`background:${s.bg};border-color:${s.border};color:${s.text};`:''}">${s.icon} ${s.label}</div>`).join("");
  const groupOpts=groups.map(g=>`<option value="${g}">${g}</option>`).join("");
  document.getElementById("overlays").innerHTML=`
  <div class="overlay" onclick="if(event.target===this)closeOverlay()">
    <div class="modal">
      <div class="modal-hdr"><span class="modal-hdr-title">➕ Add Employee — ${d.label}</span><button class="modal-close" onclick="closeOverlay()">×</button></div>
      <div class="modal-body">
        <div class="field"><label>Designation / Role</label><input id="ar_r" placeholder="e.g. Senior Engineer"/></div>
        <div class="field"><label>Employee Name</label><input id="ar_n" placeholder="e.g. Rajesh Kumar"/></div>
        <div class="field"><label>Role Type</label><div class="type-pills">${typePills}</div></div>
        <input type="hidden" id="ar_t" value="jr"/>
        <div class="field"><label>Group / Sub-team</label>
          <select id="ar_g" style="margin-bottom:8px;"><option value="">-- Select existing --</option>${groupOpts}</select>
          <input id="ar_ng" placeholder="Or type a new group name…"/>
        </div>
        <div class="btn-row">
          <button class="btn-primary" onclick="saveAddRole('${deptId}')">➕ Add & Sync</button>
          <button class="btn-secondary" onclick="closeOverlay()">Cancel</button>
        </div>
      </div>
    </div>
  </div>`;
}
function selAType(t){
  document.getElementById("ar_t").value=t;
  Object.entries(TYPE_CFG).forEach(([k,s])=>{
    const el=document.getElementById(`atp_${k}`);if(!el)return;
    if(k===t){el.style.background=s.bg;el.style.borderColor=s.border;el.style.color=s.text;}
    else{el.style.background="#F9FAFB";el.style.borderColor="var(--border)";el.style.color="var(--muted)";}
  });
}
function saveAddRole(deptId){
  const role=document.getElementById("ar_r").value.trim();
  if(!role){alert("Please enter a role title.");return;}
  const d=data.departments.find(x=>x.id===deptId);
  const grpNew=document.getElementById("ar_ng").value.trim();
  const grpSel=document.getElementById("ar_g").value;
  d.roles.push({id:uid(),role,name:document.getElementById("ar_n").value.trim(),type:document.getElementById("ar_t").value||"jr",group:grpNew||grpSel||"Team"});
  d.headcount++;
  saveData();render();closeOverlay();
}

/* ── DEPT PANEL ── */
function openDeptPanel(deptId){
  const dept=data.departments.find(x=>x.id===deptId);
  const groups={};
  dept.roles.forEach(r=>{const g=r.group||"Team";if(!groups[g])groups[g]=[];groups[g].push(r);});
  const typeCounts={};
  dept.roles.forEach(r=>{typeCounts[r.type]=(typeCounts[r.type]||0)+1;});
  let statsHTML=`<div style="background:#fff;border-radius:8px;padding:6px 14px;box-shadow:0 1px 4px rgba(0,0,0,.08);"><div style="font-size:18px;font-weight:800;color:${dept.color};">${dept.headcount}</div><div style="font-size:10px;color:#9CA3AF;font-weight:700;">HEADCOUNT</div></div>`;
  Object.entries(typeCounts).forEach(([t,c])=>{const s=TYPE_CFG[t];statsHTML+=`<div style="background:#fff;border-radius:8px;padding:6px 14px;box-shadow:0 1px 4px rgba(0,0,0,.08);"><div style="font-size:18px;font-weight:800;color:${s?.text};">${c}</div><div style="font-size:10px;color:#9CA3AF;font-weight:700;">${s?.label?.toUpperCase()}</div></div>`;});
  let grpsHTML="";
  Object.entries(groups).forEach(([g,roles])=>{
    grpsHTML+=`<div style="margin-bottom:18px;"><div style="font-size:11px;font-weight:700;color:#9CA3AF;letter-spacing:1.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px;"><div style="flex:1;height:1px;background:#F1F5F9;"></div>${g.toUpperCase()} <span style="color:${dept.color};">(${roles.length})</span><div style="flex:1;height:1px;background:#F1F5F9;"></div></div>`;
    roles.forEach(r=>{const s=TYPE_CFG[r.type]||TYPE_CFG.tr;
      grpsHTML+=`<div class="role-list-item" onmouseover="this.style.background='${s.bg}';this.style.borderColor='${s.border}';" onmouseout="this.style.background='#FAFBFD';this.style.borderColor='var(--border)';">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:36px;height:36px;border-radius:50%;background:${s.border};color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;">${s.icon}</div>
          <div><div style="font-size:13px;font-weight:700;color:var(--text);">${r.role}</div>
          ${r.name?`<div style="font-size:11px;color:var(--muted);">${r.name}</div>`:""}
          <span class="role-item-badge" style="background:${s.bg};color:${s.text};border:1px solid ${s.border}40;">${s.icon} ${s.label}</span></div>
        </div>
        <div style="display:flex;gap:6px;">
          <button style="background:#fff;border:1px solid ${s.border};color:${s.text};border-radius:7px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;" onclick="closeOverlay();openEditRole('${deptId}','${r.id}')">✏️</button>
          <button style="background:#FEF2F2;border:1px solid #FCA5A5;color:#DC2626;border-radius:7px;padding:5px 8px;font-size:12px;cursor:pointer;" onclick="deleteRole('${deptId}','${r.id}')">🗑️</button>
        </div>
      </div>`;
    });
    grpsHTML+=`</div>`;
  });
  document.getElementById("overlays").innerHTML=`
  <div class="overlay" onclick="if(event.target===this)closeOverlay()">
    <div class="panel">
      <div class="panel-hdr" style="background:linear-gradient(135deg,${dept.color}18,${dept.color}04);border-bottom:2px solid ${dept.color}30;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,${dept.color},${dept.color}80);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;box-shadow:0 4px 12px ${dept.color}40;">${dept.num}</div>
            <div><div style="font-size:20px;font-weight:800;color:var(--text);">${dept.label}</div>
            <div style="font-size:12px;color:var(--muted);">${dept.headcount} people · ${dept.roles.length} positions</div></div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;">
            <button style="background:#fff;border:1.5px solid ${dept.color}60;color:${dept.color};border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;" onclick="closeOverlay();openEditDept('${deptId}')">✏️ Edit</button>
            <button style="background:#F1F5F9;border:none;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px;color:var(--muted);" onclick="closeOverlay()">×</button>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">${statsHTML}</div>
      </div>
      <div class="panel-body">
        ${dept.description?`<div style="background:#F8FAFC;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13px;color:var(--text);line-height:1.7;border-left:3px solid ${dept.color};">${dept.description}</div>`:""}
        ${dept.weeklyTarget?`<div style="background:rgba(200,150,46,.1);border:1px solid rgba(200,150,46,.3);border-radius:10px;padding:10px 16px;margin-bottom:18px;display:flex;align-items:center;gap:10px;"><div style="font-size:18px;">🎯</div><div><div style="font-size:10px;font-weight:700;color:#C8962E;letter-spacing:1px;">WEEKLY TARGET</div><div style="font-size:13px;font-weight:600;color:var(--text);">${dept.weeklyTarget}</div></div></div>`:""}
        <button onclick="closeOverlay();openAddRole('${deptId}')" style="width:100%;background:linear-gradient(135deg,${dept.color}10,${dept.color}03);border:2px dashed ${dept.color}50;border-radius:10px;padding:12px;font-size:14px;font-weight:700;color:${dept.color};cursor:pointer;margin-bottom:18px;box-sizing:border-box;">➕ Add New Employee to ${dept.label}</button>
        ${grpsHTML}
      </div>
    </div>
  </div>`;
}

function resetData(){
  if(!confirm("Reset everything to default? All changes will be lost."))return;
  data=JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveData();render();
}

initFirebase();
</script>
</body>
</html>
